[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "defcom-dc-bot"
version = "0.2.0"
description = "Bot de gerenciamento do servidor Discord da DEFCOM"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.6,<3", "python-dotenv>=1,<2"]

[project.scripts]
defcom-bot = "defcom_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["defcom_bot*"]
